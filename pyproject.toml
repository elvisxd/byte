[project]
name = "byte"
version = "0.1.0"
description = "Agente de IA local (self-hosted) que programa, busca en internet y usa herramientas vía MCP"
# Techo en 3.14: la versión de pydantic del lock llama a typing._eval_type()
# con un argumento que 3.14 removió, y falla en el propio import de fastapi.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Extraer el texto legible de una página: sin esto, lo que entra al prompt
    # es el HTML entero —menús, scripts, banners— y el contenido se pierde.
    "selectolax>=0.3",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-ollama>=1.1",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.3.5",
    "tavily-python>=0.8",
    # Parseo de los PDF que se suben al RAG (Fase 2). Python puro: no agrega
    # binarios al contenedor.
    "pypdf>=5.1",
    # FastAPI lo necesita para leer los uploads multipart de POST /documents.
    "python-multipart>=0.0.18",
    "mcp>=1.12",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
]

[project.optional-dependencies]
# nh3 sanea Markdown->HTML; se usa a partir de la Fase 5 (Jinja+HTMX).
# En el MVP la página mínima renderiza con textContent, sin HTML.
html = ["nh3>=0.2"]
observabilidad = [
    "langfuse>=3.0",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.7",
    # Emulador de terminal: los tests del CLI miran lo que queda **en pantalla**
    # después de aplicar los escapes, no los bytes escritos. Un \033[F borra una
    # línea ya dibujada, así que contar apariciones en la salida cruda no dice
    # lo que el usuario ve.
    "pyte>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# assert es el modo normal de pytest; S105/S106 marcan las credenciales de
# juguete de los fixtures, que justamente no son secretos.
# S603/S607 (subprocess con ruta parcial): los tests de git llaman a `git` del
# PATH con argumentos literales del archivo, que es justamente lo que se quiere
# ejercitar — simularlo probaría el simulador.
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
# S608 (SQL por interpolación): en este módulo las consultas interpolan solo
# constantes del propio archivo — listas de columnas y cláusulas fijas. Todo
# valor que venga de afuera va parametrizado con %s, nunca interpolado.
"db/repository.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# El proyecto no se instala como paquete: los módulos se importan desde la raíz
# del repo (api/, agent/, tools/, db/). uv solo resuelve e instala dependencias.
package = false
