# Qué trabajo se busca. Es tuyo: editalo y el cazador cambia sin tocar código.
#
# Va en TOML y no en markdown como el resto de `perfil/` porque esto no lo lee
# el modelo, lo lee el código que puntúa. El criterio con el que se descarta una
# oferta tiene que ser un dato revisable en un diff, no una frase que el modelo
# interpreta distinto cada vez.

[perfil]
# Años de experiencia. Solo se usa para marcar las ofertas junior, que son ruido
# a los diez años y aparecen igual en cualquier feed de "developer".
anios = 10
# Dónde estás hoy. No filtra nada: sirve para que el aviso diga si una oferta
# presencial te queda cerca o al otro lado del país.
ubicacion = "Orlando, Florida"
# Las mudanzas previstas viven en `perfil/privado.md`, que no se versiona: son
# las que vuelven inservible a una oferta local por buena que sea, y no tienen
# por qué leerlas los mismos a los que les mandás el CV.

[stack]
# El peso es cuánto suma que la oferta mencione eso. Alto = es tu diferencial y
# una oferta que lo pide te busca a vos; bajo = lo sabés pero lo sabe todo el
# mundo, y encontrarlo no dice mucho.
#
# Los términos se buscan en el título y en el cuerpo, sin distinguir mayúsculas.
# Un término de una sola letra o demasiado común ("go", "c") daría falsos
# positivos en cualquier texto largo: por eso van los nombres completos.
fuerte = [
  "langgraph", "langchain", "rag", "retrieval augmented", "pgvector",
  "llm", "large language model", "ai agent", "agentic", "prompt engineering",
  "vector database", "embeddings", "mcp", "model context protocol",
  "openai", "anthropic", "claude", "gemini", "ollama",
]
medio = [
  "next.js", "nextjs", "nestjs", "react native", "fastapi",
  "typescript", ".net", "c#", "graphql", "pgsql", "postgresql",
]
leve = [
  "react", "node.js", "nodejs", "python", "docker", "redis",
  "tailwind", "express", "rest api", "microservices",
]

[preferencias]
# Cuánto suma cada cosa que te importa. Poner 0 la apaga sin borrar la línea.
#
# Contratan latinoamericanos: lo que más pesa. Una oferta "worldwide" o que
# nombra LatAm te contrata sin que nadie tenga que patrocinar nada.
latam = 30
# Remoto en cualquier parte del mundo.
remoto_global = 20
# Reubicación: la pagan, o al menos se comprometen. Pesa igual que el remoto
# global porque son dos caminos igual de válidos para el mismo objetivo —
# trabajar desde donde estés—, no uno bueno y uno de consuelo.
#
# Nombrarla para negarla NO suma: "no relocation assistance is provided"
# tiene todas las palabras de una buena noticia y dice lo contrario.
reubicacion = 20
# Contratación como contractor / EOR (Deel, Remote.com): el camino por el que
# una empresa de afuera contrata sin abrir entidad legal.
contractor = 12
# Freelance por proyecto (Upwork y similares).
freelance = 5

[penalizaciones]
# Restan. Ninguna descarta sola: el aviso muestra la señal y decidís vos.
#
# Junior / entry level: a los diez años es tiempo perdido.
junior = 40
# Dice explícitamente que no patrocina visas. Se muestra siempre, pero solo
# resta si abajo declarás que la necesitás.
sin_patrocinio = 25
# Solo Estados Unidos. Resta, aunque hoy estés en Orlando y puedas trabajar ahí:
# lo que buscás es un puesto que sobreviva a las mudanzas de `privado.md`, y uno
# que exige estar en el país no lo hace. No descarta —ninguna señal descarta
# sola—, pero deja de competir de igual a igual con una "worldwide".
# Si querés volver a mirar puestos locales, esto vuelve a 0 en una línea.
solo_us = 20
# Híbrido y presencial. Pesan más que cualquier otra penalización porque no son
# un puesto peor: son un puesto imposible. Estando en Estados Unidos, una oferta
# híbrida en Santiago no se puede ni postular.
#
# Con 45, una oferta híbrida cae debajo del mínimo del aviso aunque el stack
# coincida entero: en los hechos deja de llegarte al teléfono. No se descarta en
# el código —ninguna señal descarta sola— así que sigue apareciendo en el digest
# del disco, que es donde se ve si el criterio quedó demasiado duro.
#
# Ojo: una oferta que dice "100% remote, no hybrid" NO cuenta como híbrida. La
# negación se detecta primero y gana.
hibrido = 45
presencial = 45

[situacion]
# Esto cambia cómo se leen las señales de visa, así que conviene tenerlo
# explícito y no adivinado. Si hoy necesitás que una empresa patrocine para
# trabajar, poné `true` y las ofertas que dicen "no sponsorship" bajan.
necesita_patrocinio = false

[fuentes]
# Qué feeds se consultan. Todas publican API o RSS oficial: acá no se scrapea
# nada. Upwork es la excepción y está explicada en `empleo/README.md`.
remoteok = true
remotive = true
# We Work Remotely: APAGADO desde 2026-09-18.
#
# Postular en WWR es una función paga. No es un muro sobre algunas ofertas: en
# su propia pantalla de suscripción, "Apply to unlimited remote jobs on WWR"
# figura como beneficio INCLUIDO en el plan. Un link del feed terminó en
# `/job-seekers/onboarding/step_3?context=paywall&payment_plan=top_access`, que
# es el paso 3 de 3 de ese onboarding.
#
# En septiembre de 2026 pedían USD 34.95/año por WWR solo, o 59.95 por el bundle
# TopAccess (WWR + PeoplePerHour + Arc + Toptal), los dos pagos por adelantado y
# con renovación automática anual.
#
# Un link al que no podés aplicar sin pagar no es una oferta: es publicidad. Y
# el cazador existe para mandarte links a los que sí podés aplicar, así que
# mandarlos igual sería gastarte la atención cinco veces al día.
#
# Si revierten el cobro, esto vuelve cambiando `false` por `true` (y borrando el
# test que lo fija, que dice por qué). Mientras tanto, si ves una oferta de WWR
# que te interesa: tenés la empresa y el puesto, así que buscala en la web de la
# empresa y aplicá ahí — que además suele ser la fila más corta.
weworkremotely = false
hackernews = true
# Empresas por su propia página de Careers (ver `[[empresas]]` más abajo).
empresas = true
# Get on Board: el único que nace en la región. Las empresas que publican ahí ya
# contratan latinoamericanos, así que sus ofertas no dependen de que alguien se
# haya acordado de escribir "LATAM" en la descripción. Su API pide qué buscar:
# usa los términos de `[stack] fuerte`, así que cambiarlos cambia esto también.
getonbrd = true
# LinkedIn, leyendo las alertas que ya te manda al correo. No es raspado: son
# correos tuyos, y es la única vía legítima a LinkedIn —no publica feed y
# prohíbe el scraping—. Necesita GMAIL_USUARIO y GMAIL_APP_PASSWORD en el
# `.env`; sin eso no trae nada y lo dice. Las ofertas salen de las búsquedas
# guardadas que tengas en LinkedIn, así que el criterio de qué llega se define
# allá y acá solo se puntúa.
linkedin = false
# Upwork solo se activa con una API key aprobada por ellos. Sin key no trae
# nada y lo dice: no hay modo "probemos igual", porque el modo de probar igual
# es el que termina en cuenta suspendida.
upwork = false

[frescura]
# Cuánto suma —o resta— llegar temprano, por tramos de antigüedad de la oferta.
#
# El reclutador no lee las 300 postulaciones: lee las primeras 20 o 40 de la
# cola. El ATS ordena esa cola, no rechaza por su cuenta (sólo ~8% habilita el
# auto-rechazo). Así que llegar tarde no es que te filtren: es que te leen
# después de que ya entrevistaron a alguien.
#
# Las 96 horas son el umbral medido que aparece en la literatura del tema. Los
# múltiplos que publican las empresas del rubro —"8 veces más entrevistas"— son
# de blogs que venden urgencia: acá se usa la dirección del hallazgo, que es
# sólida, no el número.
#
# Una oferta sin fecha no suma ni resta: que un feed no la mande no la vuelve
# vieja.
hasta_24h = 25
hasta_48h = 15
hasta_96h = 8
hasta_7d = 0
mas_vieja = -10

# Empresas a las que se les pregunta directo, sin esperar a que publiquen en un
# agregador —muchas grandes nunca lo hacen—. Se consulta el JSON público que
# alimenta su propia página de Careers: no se raspa nada.
#
# El `token` es el identificador de la empresa en su plataforma, y sale de mirar
# la URL de su página de empleos:
#
#   boards.greenhouse.io/TOKEN  ·  job-boards.greenhouse.io/TOKEN   -> ats = "greenhouse"
#   jobs.lever.co/TOKEN                                             -> ats = "lever"
#   jobs.ashbyhq.com/TOKEN                                          -> ats = "ashby"
#   EMPRESA.wdN.myworkdayjobs.com/SITIO                             -> ats = "workday"
#
# O, sin mirar nada, pegando la URL de su página de empleos:
#
#   uv run python -m empleo.cazador --agregar-empresa "Vercel" https://jobs.ashbyhq.com/vercel
#
# que la prueba y te imprime el bloque listo para pegar acá.
#
# Los cinco de abajo RESPONDEN: se verificaron contra las APIs reales el
# 2026-09-17 y entre los cinco devolvieron 1.734 puestos.
#
# Se probaron y se cayeron dos, por si querés reintentarlas con otro token:
# Zapier en Greenhouse y Netflix en Lever, las dos con 404. Lo más probable es
# que se hayan cambiado de plataforma; el token correcto sale de abrir su página
# de empleos y mirar la URL.
#
# Para lo que agregues:
#
#   uv run python -m empleo.cazador --probar-empresas
#
# dice cuáles responden y cuántos puestos trae cada una. Esta lista vale por lo
# que elijas vos, no por lo que vino de fábrica.

[[empresas]]
nombre = "GitLab"
ats = "greenhouse"
token = "gitlab"

[[empresas]]
nombre = "Cloudflare"
ats = "greenhouse"
token = "cloudflare"

[[empresas]]
nombre = "Stripe"
ats = "greenhouse"
token = "stripe"

[[empresas]]
nombre = "Anthropic"
ats = "greenhouse"
token = "anthropic"

[[empresas]]
nombre = "Datadog"
ats = "greenhouse"
token = "datadog"

[[empresas]]
nombre = "Linear"
ats = "ashby"
token = "linear"

[[empresas]]
nombre = "Grafana Labs"
ats = "greenhouse"
token = "grafanalabs"

[[empresas]]
nombre = "Sourcegraph"
ats = "greenhouse"
# El token lleva un "91" pegado que no sale del nombre: es el ejemplo de por qué
# esto no se adivina y se saca de la URL de su board.
token = "sourcegraph91"

[[empresas]]
nombre = "OpenAI"
ats = "ashby"
token = "openai"

[[empresas]]
nombre = "Chevron"
ats = "workday"
# Workday necesita tres datos —inquilino, shard y sitio— y los tres están en
# esta URL, así que su "token" es la URL entera. Ver el aviso de `empleo/
# fuentes.py`: es el único adaptador que no habla con una API documentada.
token = "https://chevron.wd5.myworkdayjobs.com/jobs"

[aviso]
# Cuántas ofertas entran en el mensaje de Telegram. Más que esto no se lee, y
# además no entra: el panel que reenvía a Telegram rechaza los textos de más de
# 1000 caracteres, así que un aviso más largo llega cortado. Medido el
# 17/09/2026: cuatro ofertas ocupan 820 caracteres y cinco ya se pasan. Las que
# no entran siguen en el digest del disco.
tope_por_aviso = 4
# Cuántas de la MISMA empresa pueden entrar. Los marketplaces de talento
# —Lemon.io, Toptal— republican su catálogo entero todo el tiempo y con buen
# puntaje: sin tope se llevan casi todos los lugares y las ofertas frescas del
# resto quedan afuera. Lo que pasa el tope no se pierde, baja en la lista y
# sigue en el digest. Poner 0 lo apaga.
tope_por_empresa = 2
# Después de cuántos días una oferta ya no llega al teléfono, por buena que sea.
# Restarle puntos no alcanzaba: una que menciona todo el stack absorbe la
# penalización de `[frescura]` y sigue arriba. Medido el 17/09/2026, dos de las
# cuatro que llegaban tenían 29 días — a esa altura ya entrevistaron a alguien.
# Siguen en el digest del disco. Poner 0 lo apaga.
descartar_despues_de_dias = 7
# Cuántas horas de silencio se aguantan antes de mandar una línea de "sigo vivo".
#
# Cuando no hay nada sobre el mínimo, el cazador NO manda nada. Cinco "no
# encontré nada" por día hábil no son información: son el mensaje que te enseña
# a no abrir el canal, y entonces el día que llega uno bueno tampoco lo abrís.
#
# Pero el silencio total mentiría: un cron muerto se ve igual que un día
# tranquilo. Con esto, cada 24 h de silencio sale una sola línea. Poner 0 lo
# apaga y el silencio pasa a ser total. (Que ninguna fuente devuelva nada se
# avisa siempre, sin importar este número: eso no es un día tranquilo.)
horas_sin_aviso = 24
# Puntaje mínimo para que una oferta llegue al teléfono. Las que quedan abajo
# se guardan igual en el digest de disco, por si el criterio quedó muy duro.
puntaje_minimo = 25
