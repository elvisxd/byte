# Plantilla del overlay privado. Copiala a `perfil/privado.toml`.
#
# `privado.toml` está en `.gitignore` y NO se sube: este repo es público, y hay
# preferencias que delatan cosas que no tienen por qué leerse. Se superpone a
# `busqueda.toml` sección por sección, así que acá va sólo lo que cambia.

[situacion]
# Países donde un puesto PRESENCIAL o HÍBRIDO sí te sirve, en minúsculas.
#
# Sin esto, todo lo presencial resta 45 y se hunde —que es lo correcto para una
# oferta híbrida en una ciudad donde no vas a estar—. Pero un presencial en un
# país al que te estás mudando es aplicable, y hundirlo te lo esconde.
#
# Va acá y no en `busqueda.toml` porque la lista dice dónde vas a estar
# viviendo, que es exactamente el dato que decidimos no publicar.
presencial_aceptable_en = ["venezuela", "caracas"]
