name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Todo el rango de `requires-python`: las incompatibilidades de una
        # versión de Python aparecen acá y no al desplegar.
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      # Con esto, los tests del repositorio y del checkpointer corren también
      # contra Postgres. Sin la variable se saltean, y el bug de paginación que
      # solo aparecía ahí habría vuelto a pasar desapercibido.
      BYTE_TEST_DATABASE_URL: postgresql://byte:byte@127.0.0.1:5432/byte
    services:
      postgres:
        # La misma imagen que usa el compose: trae pgvector para la Fase 2.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: byte
          POSTGRES_PASSWORD: byte
          POSTGRES_DB: byte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byte -d byte"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # ⚠ CON `--extra observabilidad`, O 17 TESTS NO CORREN. `uv sync --frozen`
      # a secas no instala los extras, así que langfuse y sentry-sdk faltaban y
      # todo test_observabilidad.py moría con ModuleNotFoundError. Eso pasó
      # desapercibido porque el paso «Formato» fallaba ANTES y los tests ni
      # llegaban a ejecutarse: tres merges seguidos en rojo sin que nadie mirara
      # por qué. Las dos librerías ya estaban en el lock —langfuse 4.15.2,
      # sentry-sdk 2.69.1—: lo único que faltaba era pedirlas.
      - name: Instalar dependencias desde el lock
        run: uv sync --frozen --extra observabilidad

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  imagen:
    name: Build de la imagen y arranque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la API
        run: docker build -f docker/Dockerfile.api -t byte-api:ci .

      - name: Construir la imagen del sandbox
        run: docker build -f docker/Dockerfile.sandbox -t byte-sandbox:ci .

      - name: El sandbox arranca y ejecuta Python
        run: |
          # Las credenciales de prueba se generan al vuelo: así no hay ningún
          # literal con pinta de secreto en el repo (gitleaks los marca, y hace
          # bien: no se puede distinguir de uno real mirando el archivo).
          TOKEN="$(openssl rand -hex 16)"
          docker run --rm -d --name sandbox-ci \
            -e SANDBOX_TOKEN="$TOKEN" -p 3000:3000 byte-sandbox:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:3000/execute \
            -H "X-Internal-Token: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"code":"print(6*7)"}' | grep -q '"stdout":"42' \
            || { docker logs sandbox-ci; exit 1; }
          docker rm -f sandbox-ci

      - name: Construir la imagen de la página de ofertas
        run: docker build -f docker/Dockerfile.ofertas -t byte-ofertas:ci .

      - name: La página de ofertas arranca, pide clave y analiza
        run: |
          # Esta imagen no instala las dependencias del proyecto: el camino de
          # /ofertas usa sólo la biblioteca estándar. Si alguien agrega un import
          # de httpx o selectolax ahí, la imagen se construye igual y revienta al
          # arrancar — este paso es lo que lo encuentra antes de desplegar.
          CLAVE="$(openssl rand -hex 16)"
          docker run --rm -d --name ofertas-ci \
            -e OFERTAS_CLAVE="$CLAVE" -p 8100:8000 byte-ofertas:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/salud && break
            sleep 1
          done
          # Sin clave tiene que rechazar: es una URL pública.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8100/api/v1/ofertas/pegado \
            -H 'Content-Type: application/json' -d '{"texto":"x"}')" = "401" \
            || { docker logs ofertas-ci; exit 1; }
          # Con clave, analiza de verdad.
          curl -sf -X POST http://127.0.0.1:8100/api/v1/ofertas/pegado \
            -H "Authorization: Bearer $CLAVE" -H 'Content-Type: application/json' \
            -d '{"texto":"Senior AI Engineer\nProposals: Less than 5\nPayment verified"}' \
            | grep -q '"sitio":"upwork"' || { docker logs ofertas-ci; exit 1; }
          docker rm -f ofertas-ci

      - name: Construir la imagen del cazador
        run: docker build -f docker/Dockerfile.cazador -t byte-cazador:ci .

      - name: El cazador arranca y no pide red para saber qué buscar
        run: |
          # `--probar` recorre las fuentes; acá sólo se comprueba que la imagen
          # tenga todos los paquetes y que el criterio cargue. Sin esto, un
          # import que falta se descubre a las nueve de la mañana, cuando el
          # cron no avisa nada y parece que no había ofertas.
          docker run --rm byte-cazador:ci python -c "
          from pathlib import Path
          from empleo.criterio import cargar_criterio
          import empleo.cazador
          c = cargar_criterio(Path('/app/perfil/busqueda.toml'))
          assert c.fuentes['weworkremotely'] is False, c.fuentes
          print('cazador ok')
          "

      - name: El overlay privado entra por variable y no por archivo
        run: |
          docker run --rm -e BYTE_PERFIL_PRIVADO='[situacion]
          presencial_aceptable_en = ["venezuela"]' byte-cazador:ci python -c "
          from pathlib import Path
          from empleo.criterio import cargar_criterio
          c = cargar_criterio(Path('/app/perfil/busqueda.toml'))
          assert c.presencial_aceptable_en == ('venezuela',), c.presencial_aceptable_en
          print('overlay ok')
          "

      - name: La app importa dentro de la imagen
        run: docker run --rm byte-api:ci python -c "import api.main; print('import ok')"

      - name: La API responde en /health
        run: |
          docker run --rm -d --name byte-ci \
            -e BYTE_API_KEY="$(openssl rand -hex 8)" \
            -e BYTE_SECRET_KEY="$(openssl rand -hex 16)" \
            -e BYTE_STORAGE=memory \
            -p 8000:8000 byte-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health
          docker logs byte-ci | tail -5
          docker rm -f byte-ci

  sandbox:
    name: Sandbox (Pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sandbox/package-lock.json

      - name: Instalar dependencias desde el lock
        run: npm ci
        working-directory: sandbox

      - name: Tests del sandbox (incluye los de escape)
        run: npm test
        working-directory: sandbox

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita el historial completo para revisar los commits.
          fetch-depth: 0

      - name: Buscar secretos (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Auditar dependencias de producción
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt > /tmp/requirements-audit.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements-audit.txt --strict
